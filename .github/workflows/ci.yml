name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Los datos se regeneran idénticos (semilla fija)
        run: |
          python3 data/gen_data.py
          git diff --exit-code data/
      - name: El cálculo independiente reproduce las cifras esperadas
        run: python3 qa/oraculo.py | diff - qa/esperado.json
      - name: La salida guardada de la última ejecución coincide en las 50 cifras
        run: python3 qa/comparar.py qa/evidencia/salida_98.json
      - name: Los notebooks son Python válido y sus comentarios no alteran el código
        run: |
          python3 tools/comentar_notebooks.py --quitar
          python3 tools/comentar_notebooks.py
          git diff --exit-code notebooks/
