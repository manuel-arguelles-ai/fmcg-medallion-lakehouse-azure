name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Los datos se regeneran idénticos (semilla fija)
        run: |
          python3 data/gen_data.py
          git diff --exit-code data/
      - name: El cálculo independiente reproduce las cifras esperadas
        run: python3 qa/oraculo.py | diff - qa/esperado.json
      - name: El notebook de cifras esperadas está sincronizado con el cálculo independiente
        run: |
          python3 tools/sincronizar_validacion.py
          git diff --exit-code notebooks/esperado.py
      - name: La salida guardada de la última ejecución pasa todas las comprobaciones
        run: python3 qa/comparar.py qa/evidencia/salida_98.json
      - name: Los notebooks son Python válido y sus comentarios no alteran el código
        run: |
          python3 tools/comentar_notebooks.py --quitar
          python3 tools/comentar_notebooks.py
          git diff --exit-code notebooks/
      - name: La evidencia guardada corresponde a los notebooks actuales
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, sys
          esperado = json.load(open("qa/evidencia/ejecucion_job.json"))["sha256_notebooks"]
          actual = {f.split("/")[-1]: hashlib.sha256(open(f, "rb").read()).hexdigest()[:16] for f in glob.glob("notebooks/*.py")}
          distintos = sorted(k for k in set(esperado) | set(actual) if esperado.get(k) != actual.get(k))
          if distintos:
              sys.exit(f"Notebooks cambiados desde la última ejecución registrada: {distintos}. Vuelve a ejecutar el pipeline y actualiza qa/evidencia/.")
          print("evidencia al día:", len(actual), "notebooks")
          PY
